name: Build Pearl Miner Image
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag"
        required: true
        default: "latest"
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set build variables
        run: echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/node-worker:${{ env.IMAGE_TAG }}

      - name: Done
        run: echo "Pushed ghcr.io/${{ github.repository_owner }}/node-worker:${{ env.IMAGE_TAG }}"
