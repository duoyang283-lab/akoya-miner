name: Build Node Worker Docker Image
on:
  workflow_dispatch:
    inputs:
      gemm_variants:
        description: "GEMM variants: modern, all, legacy-cuda122, legacy"
        required: true
        default: "modern"
      image_tag:
        description: "Docker image tag"
        required: true
        default: "latest"
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set build variables
        run: |
          echo "NW_GEMM_VARIANTS=${{ github.event.inputs.gemm_variants }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
          build-args: |
            NW_GEMM_VARIANTS=${{ env.NW_GEMM_VARIANTS }}
      - name: Output image reference
        run: echo "Pushed ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}"
